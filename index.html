<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VectorDraw Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="topbar">
        <div class="logo">🎨 VectorDraw Pro</div>
        <div class="controls">
            <input type="color" id="strokeColor" value="#58a6ff" title="Stroke Color">
            <input type="color" id="fillColor" value="#000000" title="Fill Color (Black = None)">
            <button id="undoBtn">↩ Undo</button>
            <button id="redoBtn">↪ Redo</button>
            <button id="graphBtn">📈 Toggle Graph</button>
            <button id="bgImageBtn">📷 Upload Image (Trace)</button>
            <input type="file" id="imageUpload" accept="image/*" style="display: none;">
            <button id="clearBtn">🗑 Clear</button>
            <button id="generateBtn" class="primary-btn">▶ Generate XML</button>
        </div>
    </div>

    <div class="main-area">
        <div class="sidebar">
            <button class="tool active" data-tool="pencil">✏️</button>
            <button class="tool" data-tool="line">📏</button>
            <button class="tool" data-tool="rect">🔲</button>
        </div>
        <div class="canvas-container" id="canvasContainer">
            <canvas id="drawingCanvas" width="800" height="600"></canvas>
        </div>
    </div>

    <div id="xmlModal" class="modal">
        <div class="modal-content">
            <h3>Generated Android XML</h3>
            <p style="font-size: 12px; color: #888;">Set your DP size. Viewport is fixed to 800x600.</p>
            <div class="size-inputs">
                <input type="number" id="outWidth" value="200" placeholder="Width (dp)">
                <input type="number" id="outHeight" value="200" placeholder="Height (dp)">
                <button id="updateXmlBtn">Update Size</button>
            </div>
            <textarea id="xmlCodeBox" readonly></textarea>
            <button id="copyBtn" class="primary-btn">📋 Copy Clean Code</button>
            <button id="closeModalBtn">Close</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
